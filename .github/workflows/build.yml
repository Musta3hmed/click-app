name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build Click (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Emoji render as boxes wherever the emoji font is unavailable (live
      # issue in the iOS 26.3 simulator), so they are banned from Swift
      # sources outright — including runtime-generated regional-indicator
      # flags. UI chrome uses SF Symbols or vectors instead.
      - name: Ban emoji in Swift sources
        run: |
          set -e
          MATCHES=$(perl -CSD -ne 'print "$ARGV:$.: $_" if /[\x{1F000}-\x{1FAFF}\x{1F1E6}-\x{1F1FF}\x{2600}-\x{27BF}\x{FE0F}\x{2B50}\x{2B55}]/' $(find Click ClickTests ClickUITests -name '*.swift') || true)
          if [ -n "$MATCHES" ]; then
            echo "Emoji found in Swift sources (they render as boxes on some targets):"
            echo "$MATCHES"
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Click.xcodeproj \
            -scheme Click \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
