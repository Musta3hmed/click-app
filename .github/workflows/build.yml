name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build Click (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Click.xcodeproj \
            -scheme Click \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
