name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build Click (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Emoji render as boxes wherever the emoji font is unavailable (live
      # issue in the iOS 26.3 simulator), so they are banned from Swift
      # sources outright — including runtime-generated regional-indicator
      # flags. UI chrome uses SF Symbols or vectors instead.
      - name: Ban emoji in Swift sources
        run: |
          set -e
          MATCHES=$(perl -CSD -ne 'print "$ARGV:$.: $_" if /[\x{1F000}-\x{1FAFF}\x{1F1E6}-\x{1F1FF}\x{2600}-\x{27BF}\x{FE0E}\x{FE0F}\x{2B00}-\x{2BFF}\x{231A}-\x{231B}\x{2328}\x{23E9}-\x{23FA}\x{203C}\x{2049}\x{20E3}\x{24C2}\x{3030}\x{303D}\x{3297}\x{3299}]/; close ARGV if eof' $(find Click ClickTests ClickUITests -name '*.swift') || true)
          if [ -n "$MATCHES" ]; then
            echo "Emoji found in Swift sources (they render as boxes on some targets):"
            echo "$MATCHES"
            exit 1
          fi

      # The Click motion system: every animation curve is a Theme.Motion
      # token resolved through ClickMotion. A raw curve anywhere else is a
      # build failure, not a review comment.
      - name: Ban animation curves outside the motion system
        run: |
          set -e
          MATCHES=$(grep -rnE 'spring\(response|easeInOut\(duration|easeOut\(duration|\.snappy|\.bouncy|interpolatingSpring' \
            Click --include='*.swift' \
            | grep -v 'Click/Support/Theme.swift' \
            | grep -v 'Click/Support/ClickMotion.swift' || true)
          if [ -n "$MATCHES" ]; then
            echo "Animation curves must be declared in Theme.Motion / ClickMotion only:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Click.xcodeproj \
            -scheme Click \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # CI used to run zero tests. The unit suite executes here; UI tests
      # still need a Mac with a booted simulator and stay manual for now.
      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available on this runner"; exit 1
          fi
          echo "Testing on: $DEVICE"
          xcodebuild test-without-building \
            -project Click.xcodeproj \
            -scheme Click \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -configuration Debug \
            -derivedDataPath build \
            -only-testing:ClickTests \
            CODE_SIGNING_ALLOWED=NO
